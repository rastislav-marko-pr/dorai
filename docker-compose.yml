# dorai pipeline — two ROS 2 nodes from one image.
#
#   voice : mic-array capture + beamformer  -> /dorai_clean_audio
#   stt   : subscribes to clean audio       -> /dorai_transcript
#
# Both use host networking so ROS 2 DDS discovery works between them (and with
# `ros2 topic echo` on the host) with zero extra config.
#
#   docker compose build
#   docker compose up            # both nodes
#   docker compose up stt        # transcription only (no mic needed)
#
services:
  voice:
    build: .
    image: dorai:latest
    network_mode: host
    # Share the host IPC namespace so both nodes see the SAME /dev/shm. Without
    # this, Fast DDS discovers peers over UDP but its shared-memory data
    # transport can't cross container boundaries, so topics connect yet deliver
    # zero messages.
    ipc: host
    # Expose every ALSA sound card (each USB mic enumerates as its own card).
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - ROS_DOMAIN_ID=0
    # 4-mic array -> raise the default cap (max_mics defaults to 3).
    # mic_name_filter pins the real array by device-name substring and excludes
    # stray inputs (e.g. an empty dock jack) that would otherwise be auto-picked
    # as a dead channel and collapse the beamformer. Set it to a substring of
    # your mics' name (here the PU425 lavaliers enumerate as "Earpods"); clear
    # it (-p mic_name_filter:="") to fall back to plain auto-detection.
    # publish_raw + a short publish_interval are for the demo dashboard: the raw
    # multichannel tap feeds the "before" spectrogram, and 2 s frames make the
    # visuals/transcript feel live. Drop both (or raise the interval) for a
    # production run that only needs /dorai_clean_audio.
    command: >
      ros2 run voice_mod voice --ros-args
      -p max_mics:=4
      -p mic_name_filter:=Earpods
      -p publish_raw:=true
      -p publish_raw_fast:=true
      -p publish_interval:=0.5
    restart: unless-stopped

  stt:
    build: .
    image: dorai:latest
    network_mode: host
    ipc: host        # shared /dev/shm — see note on the voice service
    environment:
      - ROS_DOMAIN_ID=0
    # Persist downloaded Vosk / Whisper models across restarts.
    volumes:
      - dorai-models:/root/.cache
    # Default engine is Vosk (streaming + partials). Swap to Whisper with:
    #   command: ros2 run stt_mod stt --ros-args -p engine:=whisper -p whisper_model:=tiny.en
    command: >
      ros2 run stt_mod stt --ros-args
      -p engine:=vosk
      -p model_lang:=en-us
    restart: unless-stopped

  # Demo dashboard — subscribes to the pipeline topics and serves a single-page
  # web UI at http://<robot-ip>:8080 (mic level meters, raw-vs-clean
  # spectrograms, live transcript, per-mic diagnostics). "Play raw/clean"
  # buttons audition the last frame through the robot's OWN speakers, so
  # /dev/snd is mapped here too for audio OUTPUT.
  web:
    build: .
    image: dorai:latest
    network_mode: host
    ipc: host        # shared /dev/shm — see note on the voice service
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      - ROS_DOMAIN_ID=0
    # play_device pins the speaker output by device-name substring (list form so
    # a name with a space stays one argument). On atb the speakers are on the
    # onboard analog jack "HDA Intel PCH: ALC700 Analog"; the ALSA/sounddevice
    # default did not reach them. Change/remove it for other hosts.
    command:
      - ros2
      - run
      - web_mod
      - web
      - --ros-args
      - -p
      - port:=${DORAI_WEB_PORT:-8080}
      - -p
      - play_device:=ALC700 Analog
    restart: unless-stopped

volumes:
  dorai-models:
